<!doctype html>
<html lang="en">
<head>
    <meta name="description" content="Get your next meal delivered by drone.">
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@200;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="delivery.css">
    
    <meta charset="UTF-8">
    <title>Drone Delivery Services LLC.</title>
</head>
<body>
    <!-- start the page header -->
    <header>
        <span>Drone Delivery </span>
    </header>
    
    <!-- start the page navigation -->
    <nav>
        <ul>
            <li><a href="index.html">About Us</a></li>
            <li><a class="active" href="delivery.html">Request a Delivery</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>
    
    <!-- start the page main -->
    <main>
        <h1>Request a delivery</h1>
         <form method="get" class="myform" action="thanks.html">

            <fieldset>
            <legend>Customer Information</legend>
            <label>First Name*<input type="text" name="fname" required></label>

            <label>Last Name*<input type="text" name="lname" required></label>

            <label>Cell Number*<input type="tel" name="phone" required placeholder="123-456-7890"></label>
            </fieldset>

            <fieldset>
                <legend>Delivery Method</legend>
                    <label><input type="radio" name="method" value="bird">Bird Delivery (5hrs)</label>

                    <label><input type="radio" name="method" value="bike">Bike Delivery (2hrs)</label>

                    <label><input type="radio" name="method" value="car">Car Delivery (30 mins)</label>
            </fieldset>

            <fieldset>
                <legend>Delivery Options</legend>
                    <label><input type="checkbox" name="doorstep" value="chosen">Doorstep</label>

                    <label><input type="checkbox" name="mailbox" value="chosen">Mailbox</label>

                    <label><input type="checkbox" name="backyard" value="chosen">Backyard</label>

                    <label> Preferred Delivery Time
                    <select name="time">
                    <option value="none">Please Select</option>
                    <option value="morning">Between 6am-11am</option>
                    <option value="noon">Between 12pm-2pm</option>
                    <option value="afternoon">Between 2pm-5pm</option>
                    <option value="overnight">10pm-3am</option>
                    </select>
                    </label>
            </fieldset>

            <label>Comments
                <textarea name="comments">Please add any special requests</textarea>
            </label>




        <input type="submit" value="Send Delivery Request">
         </form>
    </main>
    
    <!-- start the page footer -->
    <footer>
        <p>&copy;202X &bull; Drone Delivery Services &bull; <a href="mailto:zen@gmail.com">Email Us</a> </p>
    </footer>
</body>
</html>
